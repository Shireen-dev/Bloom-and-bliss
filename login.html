<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Sign In — Bloom & Bliss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="logo">Bloom<span>&amp;</span>Bliss</a>
    <div class="nav-actions">
      <a href="products.html" class="btn btn--outline btn--small">Back to Shop</a>
    </div>
  </nav>
</header>

<main>
  <section class="auth-section container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab is-active" id="tabSignIn">Sign In</button>
        <button type="button" class="auth-tab" id="tabSignUp">Create Account</button>
      </div>

      <!-- Sign In form -->
      <form id="signInForm" class="auth-form">
        <label>Email
          <input type="email" id="signInEmail" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="signInPassword" required minlength="6" placeholder="••••••••">
        </label>
        <p class="auth-error" id="signInError" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">Sign In</button>
      </form>

      <!-- Sign Up form -->
      <form id="signUpForm" class="auth-form" hidden>
        <label>Full name
          <input type="text" id="signUpName" required placeholder="Jane Doe">
        </label>
        <label>Email
          <input type="email" id="signUpEmail" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="signUpPassword" required minlength="6" placeholder="At least 6 characters">
        </label>
        <p class="auth-error" id="signUpError" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">Create Account</button>
      </form>

      <p class="auth-note">Demo only — accounts are stored in your browser, not on a real server.</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 Bloom &amp; Bliss. Student project — not a real store.</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
