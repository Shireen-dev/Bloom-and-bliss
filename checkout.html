<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Checkout — Bloom & Bliss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="logo">Bloom<span>&amp;</span>Bliss</a>
    <div class="nav-actions">
      <span id="authSlot"></span>
      <a href="products.html" class="btn btn--outline btn--small">Back to Shop</a>
    </div>
  </nav>
</header>

<main>
  <section class="checkout-section container">

    <div id="checkoutView">
      <h1>Checkout</h1>
      <div class="checkout-grid">
        <form id="checkoutForm" class="checkout-form">
          <h2>Shipping details</h2>
          <label>Full name <input type="text" id="shipName" required></label>
          <label>Address <input type="text" id="shipAddress" required></label>
          <div class="form-row">
            <label>City <input type="text" id="shipCity" required></label>
            <label>ZIP code <input type="text" id="shipZip" required></label>
          </div>
          <label>Phone <input type="tel" id="shipPhone" required></label>

          <h2>Payment</h2>
          <label>Name on card <input type="text" id="cardName" required></label>
          <label>Card number <input type="text" id="cardNumber" required maxlength="19" placeholder="1234 5678 9012 3456"></label>
          <div class="form-row">
            <label>Expiry <input type="text" id="cardExpiry" required maxlength="5" placeholder="MM/YY"></label>
            <label>CVV <input type="text" id="cardCvv" required maxlength="4" placeholder="123"></label>
          </div>
          <p class="auth-error" id="checkoutError" hidden></p>
          <button type="submit" class="btn btn--primary btn--block" id="placeOrderBtn">Place Order</button>
        </form>

        <aside class="order-summary">
          <h2>Order Summary</h2>
          <ul id="summaryItems"></ul>
          <div class="order-total"><span>Total</span><span id="summaryTotal">$0.00</span></div>
        </aside>
      </div>
    </div>

    <div id="confirmView" class="confirm-view" hidden>
      <h1>Thank you!</h1>
      <p>Your order <strong id="orderNumber"></strong> has been placed.</p>
      <p class="auth-note" style="margin-top:-8px;">(This is a demo — no real payment was processed.)</p>
      <a href="products.html" class="btn btn--primary">Continue Shopping</a>
    </div>

  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 Bloom &amp; Bliss. Student project — not a real store.</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
  // Require login before checkout
  if (!getCurrentUser()) {
    window.location.href = "login.html?redirect=checkout.html";
    return;
  }

  const summaryItems = document.getElementById("summaryItems");
  const summaryTotal = document.getElementById("summaryTotal");
  const cart = readCart();

  if (cart.length === 0) {
    summaryItems.innerHTML = `<li>Your cart is empty. <a href="products.html">Go pick a bouquet</a>.</li>`;
    document.getElementById("placeOrderBtn").disabled = true;
  } else {
    summaryItems.innerHTML = cart.map((item) => {
      const p = getProductById(item.id);
      return `<li><span>${p.name} × ${item.qty}</span><span>${formatPrice(p.price * item.qty)}</span></li>`;
    }).join("");
  }
  summaryTotal.textContent = formatPrice(cartTotalPrice());

  document.getElementById("checkoutForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!getCurrentUser()) {
      window.location.href = "login.html?redirect=checkout.html";
      return;
    }
    if (readCart().length === 0) return;
    const orderNum = "BB-" + Math.floor(100000 + Math.random() * 900000);
    document.getElementById("orderNumber").textContent = orderNum;
    writeCart([]);
    document.getElementById("checkoutView").hidden = true;
    document.getElementById("confirmView").hidden = false;
  });
});
</script>
</body>
</html>
